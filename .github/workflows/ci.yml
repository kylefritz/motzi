name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.10
          bundler-cache: true
      - name: Brakeman (security)
        run: bin/brakeman --no-pager
      - name: Bundler Audit (gem vulnerabilities)
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.10
          bundler-cache: true
      - name: Prepare RuboCop cache
        uses: actions/cache@v5
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-
      - name: RuboCop
        run: bundle exec rubocop -f github
      - name: Schema types up to date (test/schemas -> api.generated.ts)
        run: |
          bin/generate_schema_types
          git diff --exit-code app/javascript/types/api.generated.ts

  test_rails:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # coverage delta: find + download master's coverage artifact

    services:
      postgres:
        image: postgres:18
        ports: ["5432:5432"]
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v5
        with:
          # On pull_request this is the merge commit; depth 2 brings its first
          # parent (master) so bin/coverage_delta can diff HEAD^1..HEAD.
          fetch-depth: 2

      - name: Install PostgreSQL client and libvips
        # libvips: Active Storage loads its vips transformer under eager_load
        # (CI=true) and image_processing 2.x raises if the library is missing.
        # Heroku's stack ships it, so this makes CI match production.
        run: sudo apt-get -qq update && sudo apt-get -yqq install libpq-dev libvips-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.10
          bundler-cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install

      - name: Build JS assets
        run: bun run build

      - name: Rails tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          RAILS_ENV: test
          DISABLE_SPRING: "1"
          RUBYOPT: "-W:no-deprecated -W:no-experimental"
          COVERAGE: "1" # report-only SimpleCov, no minimum
        run: |
          set -o pipefail
          bin/rails db:setup
          bin/rails test --profile 10 2>&1 | tee rails-test.log

      - name: Upload Rails test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rails-test-log
          path: rails-test.log
          if-no-files-found: ignore

      # Master pushes upload this too; PR runs use the latest successful master
      # run's copy (its coverage.json) as the baseline for the delta below.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          include-hidden-files: true
          if-no-files-found: ignore

      # Report-only, except it fails for new app/lib Ruby files under 50% line
      # coverage. A missing baseline (expired artifact, first run) never fails.
      - name: Coverage delta vs master
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch master --event push \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
          if [ -n "$run_id" ] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name coverage --dir tmp/coverage-baseline; then
            echo "Baseline: master run $run_id"
          else
            echo "No master coverage artifact available; reporting this run only."
          fi
          bin/coverage_delta --baseline tmp/coverage-baseline/coverage.json

  test_system:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        ports: ["5432:5432"]
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Install PostgreSQL client and libvips
        run: sudo apt-get -qq update && sudo apt-get -yqq install libpq-dev libvips-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.10
          bundler-cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # axe-core (read from node_modules by the system test) comes from here.
      - name: Install JS dependencies
        run: bun install

      - name: Build JS assets
        run: bun run build

      # ubuntu-latest ships Google Chrome; Selenium Manager fetches the
      # matching chromedriver.
      - name: System tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          RAILS_ENV: test
          DISABLE_SPRING: "1"
          RUBYOPT: "-W:no-deprecated -W:no-experimental"
        run: |
          bin/rails db:setup
          bin/rails test:system

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-screenshots
          path: tmp/screenshots
          if-no-files-found: ignore

  test_js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: JS tests
        run: |
          set -o pipefail
          bun run test 2>&1 | tee bun-test.log

      - name: Upload JS test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bun-test-log
          path: bun-test.log
          if-no-files-found: ignore

      - name: Typecheck
        run: bun run typecheck

      - name: Typecheck tests
        run: bun run typecheck:test
