default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: motzi
  host: localhost

test:
  <<: *default
  # Each git worktree gets its own test database (motzi_test_<worktree dir>) —
  # concurrent suites sharing motzi_test clobber each other's fixtures. The main
  # checkout and CI use motzi_test. TEST_DATABASE overrides both. See
  # lib/worktree_env.rb; parallel workers append _<n>.
  database: <%= ENV.fetch("TEST_DATABASE") { WorktreeEnv.test_database_name || "motzi_test" } %>
  host: localhost

production:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>
  variables:
    # Postgres 17+: abort any transaction open longer than this, so a stuck
    # request or job can't pin one of essential-1's 20 connections (shared with
    # Solid Queue/Cable/Cache). The release phase sets 0 (disabled) for migrations.
    transaction_timeout: <%= ENV.fetch("PG_TRANSACTION_TIMEOUT", "60s") %>
